<!doctype html>
<!-- A floral spray cut from the couple's crest (its lower-left corner: peonies, jasmine, leaves and gold filigree),
     to frame the card's words. Baked on a transparent ground at 440×560 by bake.py, and mirrored on the page for the
     other side. The crop stays inside the crest's ring and clear of the monogram. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:440px;height:560px;overflow:hidden;background:none}
.sprig{position:relative;width:440px;height:560px;overflow:hidden;
  -webkit-mask-image:radial-gradient(ellipse 62% 60% at 44% 52%,#000 56%,#0000 100%);mask-image:radial-gradient(ellipse 62% 60% at 44% 52%,#000 56%,#0000 100%)}
/* Crest x 95-425, y 730-1150 at 1.33x. */
.sprig img{position:absolute;display:block;width:1668px;left:-126px;top:-971px;filter:saturate(1.15) contrast(1.03)}
</style></head><body><div class="sprig"><img src="src/crest.png" alt=""></div></body></html>
