<!doctype html>
<!-- The top band is cut straight from the couple's reference design (reference/save-the-date-reference.png, 979x1606):
     its snow-capped range and the evergreen forest along its foot, taken from inside the card's own gold border
     (source x 30-950, y 25-405 at 1.304x). The forest runs on either side of the reference's own ribbon; that ribbon is
     lifted out with a soft patch, since this template draws it in SVG. The reference already fades the forest into the paper, so this adds only a
     whisper at the very edges. Rendered at 1200x496 by bake.py. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:496px;overflow:hidden;background:#fdf9f2}
.band{position:relative;width:1200px;height:496px;overflow:hidden}
img{position:absolute;display:block;width:1277px;left:-39px;top:-33px}
.edges{position:absolute;inset:0;background:linear-gradient(to right,#fdf9f2,#fdf9f200 3%,#fdf9f200 97%,#fdf9f2)}
.foot{position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(#fdf9f200,#fdf9f2)}
/* The reference’s own ribbon starts here (x 150-830, y 360 down); this template draws it, so take the painted one off. */
.clear-ribbon{position:absolute;left:150px;top:430px;width:900px;height:80px;border-radius:40px;background:#fdf9f2;filter:blur(15px)}
</style></head><body><div class="band">
<img src="src/reference.png" alt=""><div class="clear-ribbon"></div><div class="edges"></div><div class="foot"></div>
</div></body></html>
