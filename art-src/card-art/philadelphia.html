<!doctype html>
<!-- The bottom band is cut from the couple's Philadelphia painting (reference/philadelphia-medallion.png), the way the
     top band is cut from their crest, and it keeps that painting's own arrangement: Independence Hall on the left,
     City Hall with William Penn on the right, the skyline between them, and the river along the foot.

     Every crop must stay inside the painting's inner gold ring (centre 627,627 of 1254, radius ~560 - check all four
     corners) and clear of its "SAVE THE DATE" lettering (x 450-800, y 270-680), which is why the middle is taken from
     below the lettering and the two landmarks from either side of it. A slot is the crop window; the image inside it
     is scaled by `width` and pulled into place by `left`/`top`. Rendered at 1200x680 by bake.py, and it skips the
     watercolor pass, being a painting already. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:680px;overflow:hidden;background:#fdf9f2}
.band{position:relative;width:1200px;height:680px;overflow:hidden}
.slot{position:absolute;overflow:hidden}
.slot img{position:absolute;display:block}
/* Skyline, tree line and river, carried the full width: source x 450-950, y 790-1070 at 2.4x. */
.city{left:0;top:-34px;width:1200px;height:672px;
  -webkit-mask-image:linear-gradient(#0000,#000 6%,#000 100%),linear-gradient(to right,#0000,#000 4%,#000 96%,#0000);
  mask-image:linear-gradient(#0000,#000 6%,#000 100%),linear-gradient(to right,#0000,#000 4%,#000 96%,#0000);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.city img{width:3010px;left:-1080px;top:-1896px}
/* Independence Hall: source x 170-460, y 340-950 at .8x. */
.hall{left:26px;top:36px;width:232px;height:488px;
  -webkit-mask-image:linear-gradient(to right,#000 88%,#0000 100%),linear-gradient(#0000,#000 4%,#000 94%,#0000);
  mask-image:linear-gradient(to right,#000 88%,#0000 100%),linear-gradient(#0000,#000 4%,#000 94%,#0000);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.hall img{width:1003px;left:-136px;top:-272px}
/* City Hall and William Penn: source x 930-1100, y 390-900 at .85x. */
.cityhall{right:55px;top:56px;width:145px;height:434px;
  -webkit-mask-image:linear-gradient(to left,#000 88%,#0000 100%),linear-gradient(#0000,#000 3%,#000 95%,#0000);
  mask-image:linear-gradient(to left,#000 88%,#0000 100%),linear-gradient(#0000,#000 3%,#000 95%,#0000);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.cityhall img{width:1066px;left:-791px;top:-332px}
.fade{position:absolute;inset:0;background:linear-gradient(#fdf9f2 0%,#fdf9f2cc 4%,#fdf9f200 20%)}
/* The foot settles into paper, so the card's own edge never cuts the painting off. */
.foot{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(#fdf9f200,#fdf9f2a6)}
/* The scene fades into the paper at both ends, so it reads as a painting rather than a picture cropped. */
.edges{position:absolute;inset:0;background:linear-gradient(to right,#fdf9f2,#fdf9f200 5%,#fdf9f200 95%,#fdf9f2)}
</style></head><body><div class="band">
<div class="slot city"><img src="src/philadelphia.png" alt=""></div>
<div class="slot hall"><img src="src/philadelphia.png" alt=""></div>
<div class="slot cityhall"><img src="src/philadelphia.png" alt=""></div>
<div class="fade"></div><div class="foot"></div><div class="edges"></div>
</div></body></html>
