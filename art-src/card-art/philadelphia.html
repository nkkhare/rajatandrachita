<!doctype html>
<!-- The bottom band is cut from the couple's reference design (reference/save-the-date-reference.png, 979x1606),
     taken from inside its gold border and scaled 1.304x.

     The reference paints its own "Add to Calendar" button into the sky at x 260-700, y 1120-1190, and this template
     draws that button in HTML. So the city is taken from below it (y 1195 down), and the two landmarks that rise
     above that line come from narrow crops either side of it: Independence Hall's spire at x 30-258 and City Hall's
     statue at x 760-950, both clear of the painted button. Between them the band is paper, which is where the
     countdown and the real button sit. Rendered at 1200x660 by bake.py; no watercolor pass, being a painting. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:660px;overflow:hidden;background:#fdf9f2}
.band{position:relative;width:1200px;height:660px;overflow:hidden}
.slot{position:absolute;overflow:hidden}
.slot img{position:absolute;display:block;width:1277px}
/* The city, from below the painted button: source x 30-950, y 1195-1596. */
.city{left:0;top:137px;width:1200px;height:523px;
  -webkit-mask-image:linear-gradient(#0000,#000 24%,#000 100%);mask-image:linear-gradient(#0000,#000 24%,#000 100%)}
.city img{left:-39px;top:-1558px}
/* Independence Hall, full height from above that line: source x 30-258, y 1090 down. */
.hall-top{left:0;top:0;width:297px;height:660px;
  -webkit-mask-image:linear-gradient(to right,#000 76%,#0000 100%),linear-gradient(#0000,#000 5%,#000 100%);
  mask-image:linear-gradient(to right,#000 76%,#0000 100%),linear-gradient(#0000,#000 5%,#000 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.hall-top img{left:-39px;top:-1421px}
/* City Hall's statue and tower, full height: source x 760-950, y 1090 down. */
.cityhall-top{left:952px;top:0;width:248px;height:660px;
  -webkit-mask-image:linear-gradient(to left,#000 74%,#0000 100%),linear-gradient(#0000,#000 5%,#000 100%);
  mask-image:linear-gradient(to left,#000 74%,#0000 100%),linear-gradient(#0000,#000 5%,#000 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.cityhall-top img{left:-991px;top:-1421px}
.edges{position:absolute;inset:0;background:linear-gradient(to right,#fdf9f2,#fdf9f200 3%,#fdf9f200 97%,#fdf9f2)}
</style></head><body><div class="band">
<div class="slot city"><img src="src/reference.png" alt=""></div>
<div class="slot hall-top"><img src="src/reference.png" alt=""></div>
<div class="slot cityhall-top"><img src="src/reference.png" alt=""></div>
<div class="edges"></div>
</div></body></html>
